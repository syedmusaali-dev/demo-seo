<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic HTML website with CSS and JavaScript">
    <title>My Basic Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            line-height: 1.6;
        }
        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .hero {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .hero h1 {
            margin-bottom: 15px;
        }
        .hero p {
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        .card h2 {
            margin-bottom: 10px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Website</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main id="home">
        <section class="hero">
            <h1>Welcome to My Website</h1>
            <p>This is a simple HTML, CSS and JavaScript website.</p>
            <button id="welcomeBtn">Click Me</button>
        </section>
        <section class="cards" id="services">
            <div class="card">
                <h2>Web Design</h2>
                <p>We create simple and modern websites.</p>
            </div>
            <div class="card">
                <h2>Development</h2>
                <p>We build responsive web applications.</p>
            </div>
        </section>
        <section class="hero" id="contact">
            <h2>Contact Us</h2>
            <p>Email: hello@example.com</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>
    <script>
        const button = document.getElementById("welcomeBtn");
        button.addEventListener("click", function () {
            alert("Welcome to my website!");
        });
    </script>
</body>
</html>
